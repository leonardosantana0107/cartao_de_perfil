    <title>Cartão de Perfil</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <div class="foto">
             <p>Foto</p>
    
        </div>

        Rodapé da Margin: 10px 20px 40px(topo, direita, baixo, esquerda)
    </footer>
